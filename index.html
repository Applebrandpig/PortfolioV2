<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aiham's Workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cookie&family=DM+Serif+Display:ital@0;1&family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

    :root{
        --bg:#1a1a1a;
        --text:#f5f5f5;
        --muted:#6f7988;
        --border:#536a8e;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Inter',sans-serif;
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:2rem;
    }

    .container{
        max-width:700px;
        text-align:center;
    }

    .tag{
        display:inline-block;
        border:1px solid var(--border);
        color:var(--muted);
        padding:.65rem 1rem;
        border-radius:999px;
        font-size:.85rem;
        margin-bottom:2rem;
    }

    h1{
        font-family: "Cookie", cursive;
        font-size:clamp(3rem,8vw,5rem);
        font-weight:800;
        letter-spacing:.15em;
        margin-bottom:.75rem;
    }

    .subtitle{
        color:var(--muted);
        margin-bottom:2rem;
        text-transform:uppercase;
        letter-spacing:.25em;
        font-size:.85rem;
    }

    .description{
        max-width:550px;
        margin:0 auto 2.5rem;
        line-height:1.9;
        color:#cbd5e1;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:1rem;
        flex-wrap:wrap;
        margin-bottom:3rem;
    }

    .btn{
        text-decoration:none;
        padding:14px 28px;
        border-radius:12px;
        font-weight:600;
        transition:.25s ease;
    }

    .btn-primary{
        background:white;
        color:#0f172a;
    }

    .btn-secondary{
        border:1px solid var(--border);
        color:white;
    }

    .btn-secondary:hover{
        
        color: var(--border);
    }
    .btn-primary:hover{
        
        background: var(--border);
    }


   .links{
    display:flex;
    justify-content:center;
    gap:1.5rem;
     font-size:20px;
}

.links a{
    width:48px;
    height:48px;
    border:1px solid var(--border);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    text-decoration:none;
    transition:.25s ease;
}

.links a:hover{
    color:white;
    border-color:white;
    transform:translateY(-2px);
}

.links svg{
    width:20px;
    height:20px;
}

    @media (max-width:600px){

        .buttons{
            flex-direction:column;
        }

        .btn{
            width:100%;
        }

        .links{
            gap:1rem;
        }
    }

</style>

</head>

<body>

<div class="container">



    <div class="tag">
        Website Redesign In Progress
    </div>

    <h1>AIHAM</h1>

    <p class="subtitle">
        Designer • Illustrator
    </p>

    <p class="description">
        I'm currently redesigning my portfolio website.
Until then, you can browse my portfolio booklet and download my CV.

    </p>

    <div class="buttons">

        <a href="portfolio-booklet.pdf"
           target="_blank"
           class="btn btn-primary">
            View Portfolio
        </a>

        <a href="cv.pdf"
           target="_blank"
           class="btn btn-secondary">
            Download CV
        </a>

    </div>

   <div class="links">

    <a href="mailto:aliaiham23@gmail.com" aria-label="Email">
        <i class="fa-regular fa-envelope"></i>
    </a>

    <a href="https://linkedin.com/in/ali-aiham-mohamed"
       target="_blank"
       aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
    </a>

    <a href="https://instagram.com/illustratedbyaiham"
       target="_blank"
       aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
    </a>

</div>
</div>
<script>
    lucide.createIcons();
</script>
</body>
</html>
